<div class="admin-login-wrap">
    <div class="admin-login-card">
      <img src="img/logo-fatima.png" alt="Logo del Instituto" width="72" height="72" class="admin-login-logo">
      <h1 class="admin-login-titulo">Panel de administración</h1>
      <p class="admin-login-sub">Instituto Técnico Nuestra Señora de Fátima</p>

      <div id="errorBox" class="admin-error" hidden></div>

      <form id="loginForm">
        <label class="admin-label" for="email">Correo electrónico</label>
        <input type="email" id="email" class="admin-input" required autofocus autocomplete="username">

        <label class="admin-label" for="password">Contraseña</label>
        <input type="password" id="password" class="admin-input" required autocomplete="current-password">

        <button type="submit" id="btnLogin" class="admin-btn admin-btn-rojo">Iniciar sesión</button>
      </form>

      <a href="index.html" class="admin-volver">← Volver al sitio</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
