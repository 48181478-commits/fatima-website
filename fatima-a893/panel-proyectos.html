<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos — Panel de administración</title>
  <link rel="icon" href="img/logo-fatima.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

  <nav class="admin-navbar">
    <div class="admin-navbar-inner">
      <a href="panel.html" class="admin-navbar-brand">
        <img src="img/logo-fatima.png" alt="" width="40" height="40">
        <span>Proyectos</span>
      </a>
      <div class="admin-navbar-acciones">
        <a href="panel.html" class="admin-nav-volver">← Panel principal</a>
        <span id="usuarioEmail" class="admin-usuario"></span>
        <button id="btnLogout" class="admin-btn admin-btn-contorno">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="admin-main">
    <div class="admin-container">
      <div class="admin-header">
        <div>
          <h1 class="admin-titulo">Proyectos</h1>
          <p class="admin-subtitulo">Cargá, editá, eliminá y reordená los proyectos de la escuela.</p>
        </div>
        <button id="btnAgregar" class="admin-btn admin-btn-rojo">+ Agregar proyecto</button>
      </div>

      <div id="cargando" class="admin-cargando">Cargando proyectos…</div>
      <div id="vacio" class="admin-vacio" hidden>
        <p>No hay proyectos todavía.</p>
        <button class="admin-btn admin-btn-rojo" onclick="document.getElementById('btnAgregar').click()">Agregar el primer proyecto</button>
      </div>

      <div id="listaProyectos" class="admin-grid"></div>
    </div>
  </main>

  <!-- MODAL AGREGAR / EDITAR -->
  <div class="admin-modal-overlay" id="modalOverlay" hidden>
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="modalTitulo">Agregar proyecto</h2>
        <button class="admin-modal-cerrar" id="btnCerrarModal" aria-label="Cerrar">&times;</button>
      </div>

      <div id="modalError" class="admin-error" hidden></div>

      <form id="proyectoForm">
        <div class="admin-zona-upload" id="zonaUpload">
          <input type="file" id="inputArchivo" accept="image/*" hidden>
          <img id="previewImagen" class="admin-preview" hidden alt="Vista previa">
          <div id="uploadPlaceholder">
            <span class="admin-upload-icono">📷</span>
            <p>Hacé clic o arrastrá una imagen aquí</p>
            <span class="admin-upload-ayuda">JPG, PNG o WebP</span>
          </div>
        </div>

        <label class="admin-label" for="inputNombre">Nombre del proyecto</label>
        <input type="text" id="inputNombre" class="admin-input" required maxlength="150" placeholder="Ej: FireNova">

        <label class="admin-label" for="inputDescripcion">Descripción</label>
        <textarea id="inputDescripcion" class="admin-input" rows="3" maxlength="600" placeholder="Breve descripción del proyecto"></textarea>

        <label class="admin-label" for="inputEstado">Estado</label>
        <select id="inputEstado" class="admin-input">
          <option value="activo">Activo</option>
          <option value="en_curso">En curso</option>
          <option value="pausado">Pausado</option>
          <option value="finalizado">Finalizado</option>
        </select>

        <div class="admin-modal-acciones">
          <button type="button" class="admin-btn admin-btn-contorno" id="btnCancelar">Cancelar</button>
          <button type="submit" class="admin-btn admin-btn-rojo" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL CONFIRMAR BORRADO -->
  <div class="admin-modal-overlay" id="modalBorrarOverlay" hidden>
    <div class="admin-modal admin-modal-chico">
      <div class="admin-modal-header">
        <h2>¿Eliminar proyecto?</h2>
        <button class="admin-modal-cerrar" id="btnCerrarBorrar" aria-label="Cerrar">&times;</button>
      </div>
      <p class="admin-modal-texto">Esta acción no se puede deshacer.</p>
      <div class="admin-modal-acciones">
        <button class="admin-btn admin-btn-contorno" id="btnCancelarBorrar">Cancelar</button>
        <button class="admin-btn admin-btn-rojo" id="btnConfirmarBorrar">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/panel-proyectos.js"></script>
</body>
</html>
