<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de administración — Instituto Técnico Nuestra Señora de Fátima</title>
  <link rel="icon" href="img/logo-fatima.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">

  <nav class="admin-navbar">
    <div class="admin-navbar-inner">
      <a href="index.html" class="admin-navbar-brand">
        <img src="img/logo-fatima.png" alt="" width="40" height="40">
        <span>Panel de administración</span>
      </a>
      <div class="admin-navbar-acciones">
        <span id="usuarioEmail" class="admin-usuario"></span>
        <button id="btnLogout" class="admin-btn admin-btn-contorno">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="admin-main">
    <div class="admin-container">
      <div class="admin-header">
        <div>
          <h1 class="admin-titulo">Bienvenido/a</h1>
          <p class="admin-subtitulo">¿Qué querés administrar hoy?</p>
        </div>
      </div>

      <div class="admin-dashboard">
        <a href="panel-galeria.html" class="admin-dash-card">
          <span class="admin-dash-icono">🖼️</span>
          <h2>Galería</h2>
          <p>Agregá, editá y reordená las fotos de la galería pública.</p>
          <span class="admin-dash-link">Entrar →</span>
        </a>
        <a href="panel-proyectos.html" class="admin-dash-card">
          <span class="admin-dash-icono">📁</span>
          <h2>Proyectos</h2>
          <p>Cargá y administrá los proyectos de la escuela.</p>
          <span class="admin-dash-link">Entrar →</span>
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
